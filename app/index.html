<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="panel controls" aria-label="Cover controls">
    <h1>Neon Coast <span>Cover Studio</span></h1>
    <p class="tagline">Turn your photos into a multi-panel poster cover. Everything stays on your machine — photos are never uploaded.</p>

    <div class="group">
      <label class="file-label">Add photos
        <input id="photos" type="file" accept="image/*" multiple>
      </label>
      <div class="row">
        <button id="useSamples" type="button">Use sample photos</button>
        <button id="fillAll" type="button">Fill all panels with one photo</button>
      </div>
      <p class="hint">Click a panel in the preview to select it, drag to move its photo, scroll to zoom it.</p>
      <div id="photoTray" class="tray" aria-label="Loaded photos"></div>
    </div>

    <div class="group">
      <span class="group-title">Layout</span>
      <div class="row" id="layoutRow">
        <button type="button" data-layout="hero" class="picked">Hero + 3</button>
        <button type="button" data-layout="grid">Four grid</button>
        <button type="button" data-layout="strip">Three strip</button>
        <button type="button" data-layout="full">Full bleed</button>
      </div>
    </div>

    <div class="group">
      <span class="group-title">Colour grade</span>
      <div class="row" id="gradeRow">
        <button type="button" data-grade="sunset" class="picked">Sunset</button>
        <button type="button" data-grade="neon">Neon night</button>
        <button type="button" data-grade="teal">Teal dawn</button>
        <button type="button" data-grade="magenta">Magenta heat</button>
      </div>
    </div>

    <div class="group">
      <label>Title <input id="title" type="text" maxlength="28" value="NEON COAST"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="sunset heist on the palm boulevard"></label>
    </div>

    <div class="group">
      <span class="group-title">Export size</span>
      <div class="row" id="sizeRow">
        <button type="button" data-size="1080x1080" class="picked">1080 × 1080</button>
        <button type="button" data-size="1080x1350">1080 × 1350</button>
        <button type="button" data-size="1920x1080">1920 × 1080</button>
      </div>
      <button id="export" type="button" class="export">Export PNG</button>
      <p id="status" role="status"></p>
    </div>
  </section>

  <section class="stage" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="Live cover preview"></canvas>
    <div id="panelBar" class="panel-bar" aria-label="Panels"></div>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
